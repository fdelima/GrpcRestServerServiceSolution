# version: '3.8'
name: grpc-rest-solution

volumes:
  grafana-storage: {}

services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # networks:
    #   - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    # networks:
    #   - app-network
    depends_on:
      - prometheus

# networks:
#   app-network:
#     driver: bridge